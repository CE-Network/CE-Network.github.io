<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="#top">
      <img src="Logo.PNG" alt="" class="brand-logo">
      <span class="brand-name">Dutch Circular Economy PhD-Postdoc Network</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="#about">About</a>
      <a href="#future-events">Future Events</a>
      {% assign has_past_events = site.events | where_exp: "e", "e.date < site.time" %}
      {% if has_past_events.size > 0 %}
      <a href="#past-events">Past Events</a>
      {% endif %}
      <a href="#council">Team</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>
